<!doctype html>
<html>
  <head>
    <title>Painel do Casal ❤️</title>

    <style>
      .galeria {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
      }

      .foto {
        text-align: center;
      }

      .foto img {
        width: 250px;
        border-radius: 10px;
        display: block;
        margin-bottom: 10px;
      }

      .foto button {
        background: #dc3545;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
      }

      .foto button:hover {
        background: #b02a37;
      }
    </style>
  </head>

  <body>
    <h1>Painel do Casal ❤️</h1>

    {% with mensagens = get_flashed_messages() %} {% if mensagens %}
    <ul>
      {% for mensagem in mensagens %}
      <li>{{ mensagem }}</li>
      {% endfor %}
    </ul>
    {% endif %} {% endwith %}

    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="file" name="foto" accept="image/*" required />
      <button type="submit">Enviar Foto</button>
    </form>

    <hr />

    <h2>Fotos enviadas</h2>

    <div class="galeria">
      {% for foto in fotos %}

      <div class="foto">
        <img src="{{ foto[1] }}" />

        <form action="{{ url_for('delete', foto_id=foto[0]) }}" method="POST">
          <button
            type="submit"
            onclick="return confirm('Deseja realmente excluir esta foto?');"
          >
            🗑 Excluir
          </button>
        </form>
      </div>

      {% endfor %}
    </div>
  </body>
</html>
